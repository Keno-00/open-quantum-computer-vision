[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "openqcv"
version = "0.1.0"
description = "Quantum computer vision: quantum image representations, QASM export, backends and visualization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "qiskit>=1.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
image = ["pillow>=10"]
test = ["pytest>=8"]
lint = ["ruff>=0.6"]
docs = ["sphinx>=7", "pydata-sphinx-theme>=0.15"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
openqcv = ["py.typed"]

[tool.ruff]
line-length = 79  # PEP 8
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# PEP 8 (E, W), naming (N), imports (I), PEP 257 docstrings (D),
# pyflakes (F), bugbear (B), pyupgrade (UP)
select = ["E", "W", "N", "I", "D", "F", "B", "UP"]
ignore = [
    "D105",  # __repr__ and friends: the name says it all
    "D107",  # Google style: constructor args go in the class docstring
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103"]  # a test's name is its documentation

[tool.pytest.ini_options]
testpaths = ["tests"]
# A dependency's deprecation is a future silent break: fail loudly instead.
filterwarnings = ["error::DeprecationWarning"]
