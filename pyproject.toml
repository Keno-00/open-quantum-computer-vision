[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-quantum-computer-vision"
version = "0.1.0"
description = "A unified library for quantum image representation and processing, inspired by OpenCV"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Unified from MHRQI and QARQI projects"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "matplotlib>=3.5.0",
    "opencv-python>=4.5.0",
    "scikit-image>=0.19.0",
    "qiskit>=0.19.0",
    "qiskit-aer>=0.10.0",
    "mqt.qudits>=0.1.0",
    "torch>=1.11.0",
    "piq>=0.7.0",
    "pypiqe>=0.1.0",
    "brisque>=0.1.0",
    "sk-video>=1.1.10",
]

[project.urls]
Homepage = "https://github.com/your-repo/open-quantum-computer-vision"
Repository = "https://github.com/your-repo/open-quantum-computer-vision"
Issues = "https://github.com/your-repo/open-quantum-computer-vision/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["open_quantum_cv*"]

[tool.setuptools.package-data]
"open_quantum_cv" = ["*.txt", "*.md"]